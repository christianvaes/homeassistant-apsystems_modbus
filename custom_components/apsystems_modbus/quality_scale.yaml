rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No custom actions; the power limit is a number entity and the inverter output a switch.
  appropriate-polling: done
  brands:
    status: done
    comment: Icon and logo ship in the brand folder, which Home Assistant 2026.10 and later serves itself.
  common-modules: done
  config-flow: done
  config-flow-test-coverage:
    status: done
    comment: Every error test fixes the cause and finishes the flow. A few defensive branches that the mock cannot reach are not covered.
  dependency-transparency: done
  docs-conditions:
    status: exempt
    comment: No custom conditions.
  docs-actions:
    status: exempt
    comment: No custom actions; the README documents the power limit number and the inverter output switch.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: No custom triggers.
  entity-event-setup:
    status: exempt
    comment: Entities only read coordinator data; the number writes through the coordinator.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: todo
    comment: Deliberate deviation. The ECU is checked when it is added; at every start a slow ECU would hold up or fail the start. The first poll runs in the background and reports problems.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Every entity follows the coordinator, except the power limit numbers and the inverter output switch. Those stay available on purpose, because Home Assistant skips actions on unavailable entities and a release or turning the output on must always be tried.
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The ECU has no credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Inverters are fixed by the addresses set in EMA Manager; change them via reconfigure.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: Inverters that keep delivering above the power limit after two refreshes raise a repair issue to check the installation power, and so does an inverter that got another address in EMA Manager. A replaced inverter on a known address simply continues under its device.
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Modbus TCP, no HTTP session.
  strict-typing: done
