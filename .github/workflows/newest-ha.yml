name: Newest Home Assistant

# Runs the tests against the newest Home Assistant, a beta included: the test
# package follows the betas. On every push, so a change of ours that only
# breaks there shows up at once, and every Thursday evening, so a change in
# Home Assistant shows up a week before the release. Betas and releases come
# out on Wednesday evening, the test package for them on Thursday (UTC).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test against the newest Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python -r requirements_dev.txt
          uv pip install --python .venv/bin/python --upgrade pytest-homeassistant-custom-component
      - name: Test
        run: scripts/test
