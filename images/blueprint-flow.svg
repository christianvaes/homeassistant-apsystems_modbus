<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
<title>What the blueprint sets</title>
<desc>The questions are checked in this order. The first yes decides what happens to Inverter output and Power limit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="20" width="600" height="56" rx="8" fill="#2C2C2A" stroke="#8B949E" stroke-width="1"/>
<text x="340.0" y="39.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Start</text>
<text x="340.0" y="57.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#D3D1C7">Import price changes, Home Assistant starts, or every 5 minutes</text>
<path d="M175 76 V98" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="100" width="270" height="56" rx="8" fill="#444441" stroke="#8B949E" stroke-width="1"/>
<text x="175.0" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Sun down?</text>
<path d="M310 128 H368" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="339" y="116" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#8B949E">yes</text>
<rect x="40" y="190" width="270" height="56" rx="8" fill="#444441" stroke="#8B949E" stroke-width="1"/>
<text x="175.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Import price below 0?</text>
<path d="M310 218 H368" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="339" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#8B949E">yes</text>
<rect x="40" y="280" width="270" height="56" rx="8" fill="#444441" stroke="#8B949E" stroke-width="1"/>
<text x="175.0" y="299.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Price unknown?</text>
<text x="175.0" y="317.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#D3D1C7">for less than an hour</text>
<path d="M310 308 H368" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="339" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#8B949E">yes</text>
<rect x="40" y="370" width="270" height="56" rx="8" fill="#444441" stroke="#8B949E" stroke-width="1"/>
<text x="175.0" y="389.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Exporting costs money?</text>
<text x="175.0" y="407.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#D3D1C7">export price below your setting</text>
<path d="M310 398 H368" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="339" y="386" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#8B949E">yes</text>
<path d="M175 156 V188" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="185" y="172" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#8B949E">no</text>
<path d="M175 246 V278" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="185" y="262" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#8B949E">no</text>
<path d="M175 336 V368" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="185" y="352" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#8B949E">no</text>
<path d="M175 426 V524 H368" fill="none" stroke="#8B949E" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="185" y="475" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#8B949E">no</text>
<rect x="370" y="95" width="270" height="66" rx="8" fill="#0F6E56" stroke="#0F6E56" stroke-width="1"/>
<text x="505.0" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Normal</text>
<text x="505.0" y="128.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#E1F5EE">Inverter output on</text>
<text x="505.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#E1F5EE">Power limit 100 %</text>
<rect x="370" y="185" width="270" height="66" rx="8" fill="#993C1D" stroke="#993C1D" stroke-width="1"/>
<text x="505.0" y="200.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Off</text>
<text x="505.0" y="218.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#FAECE7">Inverter output off</text>
<text x="505.0" y="236.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#FAECE7">Power limit unchanged</text>
<rect x="370" y="275" width="270" height="66" rx="8" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="1"/>
<text x="505.0" y="290.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Wait</text>
<text x="505.0" y="308.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#F1EFE8">Nothing changes</text>
<text x="505.0" y="326.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#F1EFE8">After an hour: normal</text>
<rect x="370" y="365" width="270" height="92" rx="8" fill="#534AB7" stroke="#534AB7" stroke-width="1"/>
<text x="505.0" y="384.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Limit the output</text>
<text x="505.0" y="402.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#EEEDFE">Inverter output on</text>
<text x="505.0" y="420.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#EEEDFE">Power limit: what the house can use</text>
<text x="505.0" y="438.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#EEEDFE">from Grid power or Custom power demand</text>
<rect x="370" y="491" width="270" height="66" rx="8" fill="#0F6E56" stroke="#0F6E56" stroke-width="1"/>
<text x="505.0" y="506.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF">Normal</text>
<text x="505.0" y="524.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#E1F5EE">Inverter output on</text>
<text x="505.0" y="542.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#E1F5EE">Power limit 100 %</text>
</svg>
